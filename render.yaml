services:
  - type: web
    name: cv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,ztrunk.space,www.ztrunk.space"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://ztrunk.space,https://www.ztrunk.space"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STATS_TOKEN
        generateValue: true
